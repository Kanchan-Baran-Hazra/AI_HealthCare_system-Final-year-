<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authenticating...</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }
    .card {
      background: #ffffff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      text-align: center;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="spinner"></div>
    <h2 id="status">Logging you in...</h2>
    <p id="message">Please wait while we complete authentication.</p>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. Parse URL query parameters
      const urlParams = new URLSearchParams(window.location.search);
      const accessToken = urlParams.get("access_token");
      const refreshToken = urlParams.get("refresh_token");

      if (accessToken && refreshToken) {
        // 2. Store tokens locally
        localStorage.setItem("access_token", accessToken);
        localStorage.setItem("refresh_token", refreshToken);

        // Clean query parameters from URL bar for security
        window.history.replaceState({}, document.title, window.location.pathname);

        document.getElementById("status").innerText = "Login Successful!";
        document.getElementById("message").innerText = "Redirecting to your dashboard...";

        // 3. Redirect to dashboard after storing tokens
        // setTimeout(() => {
        //   window.location.href = "/dashboard"; // Change to your desired landing page
        // }, 1000);
      } else {
        document.getElementById("status").innerText = "Authentication Failed";
        document.getElementById("message").innerText = "Missing access or refresh token.";
      }
    });
  </script>

</body>
</html>
