<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aiortc Demo</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 30px;
        }

        video {
            width: 400px;
            border: 2px solid black;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
        }
    </style>

</head>

<body>

    <h2>Browser → aiortc</h2>

    <button id="startBtn">
        Start
    </button>
    <button id="endBtn">
        End
    </button>

    <br><br>

    <video id="localVideo" autoplay playsinline muted></video>
    <audio id="remoteAudio" autoplay playsinline controls></audio>
    <input id="input_session_data" type="text">

    <script src="./static/app.js"></script>

</body>

</html>
